<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Meet the team members, engineers, and contributors building the club projects.">
    <title>Team — Club Members</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="bg-grid-overlay" aria-hidden="true"></div>
    <div class="bg-aura-glow" aria-hidden="true"></div>
    <div id="spotlight-backdrop" class="spotlight-backdrop" aria-hidden="true"></div>

    <!-- Full Viewport Dynamic SVG Rope Canvas -->
    <svg id="rope-canvas" class="rope-canvas" aria-hidden="true">
        <path id="rope-path" class="rope-path" d="" />
        <circle id="rope-anchor-top" class="rope-anchor-node" r="7" />
        <circle id="rope-anchor-bottom" class="rope-anchor-node" r="7" />
        <circle id="rope-spark" class="rope-spark" r="5" />
    </svg>

    <!-- Floating Scroll-Gliding Tux Zip-Liner -->
    <div id="penguin-glider" class="penguin-glider" aria-hidden="true" role="presentation" title="Click Tux to waddle & pull rope!">
        <div id="penguin" class="penguin-wrapper">
            <svg class="penguin-svg" viewBox="0 0 100 110" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Zip-line Pulley Wheel & Axle Notch -->
                <circle cx="50" cy="10" r="8" fill="var(--navy)" stroke="var(--frost)" stroke-width="2.5"/>
                <circle cx="50" cy="10" r="3" fill="var(--mist)"/>
                <!-- Pulley Frame Bracket & Handle -->
                <path d="M 45 10 L 45 20 L 55 20 L 55 10" stroke="var(--slate)" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
                <rect x="38" y="19" width="20" height="5" rx="2.5" fill="var(--steel)" stroke="var(--frost)" stroke-width="1.5"/>
                
                <!-- Tux's LEFT Hand HOLDING THE HANDLE -->
                <path class="flipper-left" d="M 28 52 C 22 38, 34 20, 46 20 C 50 22, 38 38, 32 56 Z" fill="var(--navy)" stroke="var(--slate)" stroke-width="2.5"/>
                <!-- Left Mitten wrapped around handle -->
                <ellipse cx="46" cy="21.5" rx="4.5" ry="3.5" fill="var(--mist)" stroke="var(--slate)" stroke-width="1.5"/>

                <!-- Tux's RIGHT Hand FREE & OUTSTRETCHED (Waving / Balancing) -->
                <path class="flipper-right" d="M 76 54 C 88 52, 96 64, 89 74 C 83 78, 78 68, 74 60 Z" fill="var(--navy)" stroke="var(--slate)" stroke-width="2.5"/>

                <!-- Feet -->
                <ellipse cx="36" cy="98" rx="14" ry="6" fill="var(--mist)" stroke="var(--slate)" stroke-width="1.5"/>
                <ellipse cx="64" cy="98" rx="14" ry="6" fill="var(--mist)" stroke="var(--slate)" stroke-width="1.5"/>
                <!-- Outer Body -->
                <path d="M 50 24 C 28 24, 20 40, 20 70 C 20 90, 30 98, 50 98 C 70 98, 80 90, 80 70 C 80 40, 72 24, 50 24 Z" fill="var(--navy)" stroke="var(--frost)" stroke-width="3"/>
                <!-- Belly -->
                <path d="M 50 42 C 36 42, 30 56, 30 76 C 30 92, 38 96, 50 96 C 62 96, 70 92, 70 76 C 70 56, 64 42, 50 42 Z" fill="var(--frost)"/>
                <!-- Scarf Accent -->
                <path d="M 32 48 Q 50 54 68 48 L 66 55 Q 50 60 34 55 Z" fill="var(--steel)" stroke="var(--slate)" stroke-width="1.5"/>
                <path d="M 56 53 L 64 68 L 56 68 L 50 53 Z" fill="var(--steel)" stroke="var(--slate)" stroke-width="1.5"/>
                <!-- Eyes & Pupils -->
                <circle cx="42" cy="35" r="5.5" fill="var(--frost)"/>
                <circle id="pupil-left" cx="43.5" cy="35" r="2.5" fill="var(--void)"/>
                <circle cx="58" cy="35" r="5.5" fill="var(--frost)"/>
                <circle id="pupil-right" cx="56.5" cy="35" r="2.5" fill="var(--void)"/>
                <!-- Beak -->
                <path d="M 43 41 Q 50 50 57 41 Q 50 43 43 41 Z" fill="var(--mist)" stroke="var(--slate)" stroke-width="2"/>
            </svg>
        </div>
    </div>

    <header class="site-header">
        <div class="site-header__top">
            <p class="site-header__mark">JLUG // ROSTER <span id="roster-badge" class="site-header__badge">200+ ACTIVE MEMBERS</span></p>
        </div>
        <h1 class="site-header__title">The people building it</h1>
        <p class="site-header__subtitle">A community of engineers, designers, and maintainers driving open-source culture. Tap or hover a card to explore.
        </p>
    </header>

    <main>
        <section class="team" aria-labelledby="team-heading">
            <h2 id="team-heading" class="visually-hidden">Team members</h2>

            <nav id="filter-bar" class="filter-bar" aria-label="Filter team members by domain">
                <button class="filter-btn is-active" type="button" data-filter="all" aria-pressed="true">All Members (<span id="count-all">8</span>)</button>
                <button class="filter-btn" type="button" data-filter="leadership" aria-pressed="false">Leadership (<span id="count-leadership">0</span>)</button>
                <button class="filter-btn" type="button" data-filter="engineering" aria-pressed="false">Engineering (<span id="count-engineering">0</span>)</button>
                <button class="filter-btn" type="button" data-filter="design-events" aria-pressed="false">Design &amp; Events (<span id="count-design-events">0</span>)</button>
            </nav>

            <div id="team-grid" class="team-grid" data-state="loading">
                <p class="team-grid__status" role="status">Loading team…</p>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>Data-driven &middot; edit <code>team.json</code> to add or remove members.</p>
    </footer>

    <!-- Reusable card layout. Cloned once per member and filled in by script.js -->
    <template id="member-card-template">
        <article class="card">
            <div class="card__media">
                <img class="card__photo" src="" alt="" loading="lazy">
            </div>

            <div class="card__body">
                <div class="card__heading">
                    <h3 class="card__name"></h3>
                    <p class="card__role"></p>
                </div>

                <button class="card__toggle" type="button" aria-expanded="false" aria-label="Show bio">
                    <span aria-hidden="true">+</span>
                </button>

                <div class="card__bio-panel">
                    <p class="card__bio"></p>
                    <ul class="card__socials"></ul>
                </div>
            </div>
        </article>
    </template>

    <script src="script.js"></script>
</body>

</html>
